
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeartCare AI - Prediction</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff5f6;color:#1e293b}
header{background:white;padding:20px 7%;box-shadow:0 2px 10px #0001}
header a{color:#dc2626;text-decoration:none;font-size:23px;font-weight:bold}
main{max-width:950px;margin:35px auto;padding:20px}
.card{background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}
h1{margin-top:0;color:#dc2626}
.intro{color:#64748b;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:white;font-size:15px}
button{margin-top:24px;width:100%;padding:15px;background:#dc2626;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#b91c1c}
button:disabled{opacity:.6;cursor:wait}
#result{display:none;margin-top:22px;padding:20px;border-radius:10px;background:#f1f5f9;line-height:1.7}
#error{color:#b91c1c;white-space:pre-wrap}
.note{font-size:13px;color:#64748b;margin-top:20px;line-height:1.6}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:20px}main{padding:12px}}
</style>
</head>
<body>
<header><a href="/">❤️ HeartCare AI</a></header>
<main>
<div class="card">
<h1>Heart Disease Prediction</h1>
<p class="intro">Enter all 13 values and press the button to request an estimate from the machine-learning model.</p>

<form id="predictionForm">
<div class="grid">
<div><label for="age">Age</label><input id="age" type="number" min="1" max="120" required value="50"></div>
<div><label for="sex">Sex</label><select id="sex"><option value="1">Male (1)</option><option value="0">Female (0)</option></select></div>
<div><label for="cp">Chest pain type (cp)</label><select id="cp"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
<div><label for="trestbps">Resting blood pressure</label><input id="trestbps" type="number" min="50" max="300" required value="120"></div>
<div><label for="chol">Cholesterol (chol)</label><input id="chol" type="number" min="50" max="700" required value="200"></div>
<div><label for="fbs">Fasting blood sugar (fbs)</label><select id="fbs"><option value="0">0 - No</option><option value="1">1 - Yes</option></select></div>
<div><label for="restecg">Resting ECG (restecg)</label><select id="restecg"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div>
<div><label for="thalach">Maximum heart rate (thalach)</label><input id="thalach" type="number" min="40" max="250" required value="150"></div>
<div><label for="exang">Exercise-induced angina (exang)</label><select id="exang"><option value="0">0 - No</option><option value="1">1 - Yes</option></select></div>
<div><label for="oldpeak">Oldpeak</label><input id="oldpeak" type="number" min="0" max="10" step="0.1" required value="1.0"></div>
<div><label for="slope">Slope</label><select id="slope"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></div>
<div><label for="ca">Number of major vessels (ca)</label><select id="ca"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
<div><label for="thal">Thal</label><select id="thal"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
</div>
<button id="submitBtn" type="submit">Predict Now ❤️</button>
</form>

<div id="result" role="status" aria-live="polite"></div>
<p class="note">Educational demonstration only. This model estimate is not a medical diagnosis and should not be used to make treatment decisions.</p>
<p><a href="/">← Back to Home</a></p>
</div>
</main>

<script>
const form = document.getElementById("predictionForm");
const resultBox = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function(event) {
    event.preventDefault();
    resultBox.style.display = "block";
    resultBox.textContent = "Calculating prediction...";
    submitBtn.disabled = true;

    const fields = [
        "age","sex","cp","trestbps","chol","fbs","restecg",
        "thalach","exang","oldpeak","slope","ca","thal"
    ];

    const payload = {};
    fields.forEach(function(field) {
        payload[field] = Number(document.getElementById(field).value);
    });

    try {
        const response = await fetch("/api/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail ? JSON.stringify(data.detail) : "Request failed");
        }

        resultBox.innerHTML = "";
        const heading = document.createElement("h2");
        heading.textContent = "Model Result";
        const prediction = document.createElement("p");
        prediction.textContent = data.result;
        const probability = document.createElement("p");
        probability.textContent = "Probability for predicted class: " + data.probability + "%";
        const noDisease = document.createElement("p");
        noDisease.textContent = "Class 0 probability: " + data.probability_no_disease + "%";
        const disease = document.createElement("p");
        disease.textContent = "Class 1 probability: " + data.probability_disease + "%";
        resultBox.append(heading, prediction, probability, noDisease, disease);
    } catch (error) {
        resultBox.textContent = "Prediction request failed: " + error.message +
            ". Check that the FastAPI server is running and inspect its terminal for errors.";
    } finally {
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
